version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facefind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Optional: Mounts the local code for faster development (hot-reload)
      - .:/app
      # Standard Linux temp directory mapping
      - /tmp/facefind:/tmp/facefind
    restart: always